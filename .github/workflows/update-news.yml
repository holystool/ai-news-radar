name: Update News, Deploy Page and Notify

on:
  schedule:
    # 每天北京时间早上 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击按钮测试

permissions:
  contents: write # 赋予 Action 权限去更新你的网页分支

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Set System Timezone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'
        
      - name: Run Scraper
        # 这里运行原始项目的抓取脚本，并生成网页所需的 data 数据
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      - name: Deploy to GitHub Pages
        # 这个步骤会将更新后的数据推送到 gh-pages 分支，激活你的网页
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ # 部署当前目录下的内容
          publish_branch: gh-pages
          # 增加这一行，强制覆盖旧内容，确保刷新
          force_orphan: true

      - name: Run Scraper
        run: |
          python scripts/update_news.py --output-dir data --window-hours 24

      # --- 新增步骤：提取 WaytoAGI 内容 ---
      - name: Extract WaytoAGI Summary
        run: python extract_waytoagi.py

      - name: Set Email Body
        id: set_body
        run: |
          # 读取刚才生成的摘要并存入环境变量
          {
            echo 'EMAIL_SUMMARY<<EOF'
            cat waytoagi_summary.txt
            echo 'EOF'
          } >> $GITHUB_ENV

      # --- 修改发送邮件步骤 ---
      - name: Send Notification Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✨ 您的 AI 灵感简报"
          to: holystool@gmail.com
          from: AI News Radar
          body: |
            早安！
            
            这是为您提取的 WaytoAGI 重点内容：
            
            ${{ env.EMAIL_SUMMARY }}
            
            ---
            查看完整新闻网页（含更多板块）：
            https://${{ github.repository_owner }}.github.io/ai-news-radar/
